<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIM Event Control 2026</title>
<meta name="theme-color" content="#16233A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --field:#EDF0F5; --panel:#FFFFFF; --panel-2:#F6F8FB;
  --ink:#16233A; --ink-2:#4A5A73; --ink-3:#7B8AA1;
  --rule:#D3DBE6; --rule-2:#E6EBF2;
  --signal:#0B6E99; --amber:#F0A500;
  --st-none:#8A93A3; --st-prog:#B26A00; --st-done:#0E7C5A;
  --st-block:#B3271E; --st-na:#AAB2BF;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(22,35,58,.05), 0 10px 26px rgba(22,35,58,.06);
  --side:246px; --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--field); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.cond{font-family:'Barlow Condensed','Inter',sans-serif}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ============ SIDEBAR (desktop) ============ */
aside{display:none}
@media(min-width:860px){
  aside{
    display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:var(--side);
    background:var(--ink);color:#fff;padding:22px 14px;z-index:50;
  }
  .brand{padding:0 8px 18px;border-bottom:1px solid #2C4A6C;margin-bottom:16px}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;line-height:1.02;
    letter-spacing:.02em;text-transform:uppercase;margin:0;
  }
  .brand span{display:block;font-size:10.5px;font-weight:500;letter-spacing:.14em;color:#93A6C4;margin-top:6px}
  .snav{display:flex;flex-direction:column;gap:2px;flex:1}
  .snav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:0;color:#A9BAD4;cursor:pointer;
    padding:10px 11px;border-radius:var(--r-sm);font-size:14px;font-weight:500;
  }
  .snav button:hover{background:#1E3050;color:#fff}
  .snav button[aria-selected="true"]{background:#24395E;color:#fff}
  .snav button svg{flex:none;opacity:.9}
  .snav .badge{
    margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:#2C4A6C;color:#C9D8EC;border-radius:20px;padding:1px 7px;
  }
  .snav button[aria-selected="true"] .badge{background:var(--amber);color:#3A2600;font-weight:600}
  .sfoot{border-top:1px solid #2C4A6C;padding-top:14px;margin-top:12px}
  main{margin-left:var(--side)}
  header.mob{display:none}
}

/* ============ MOBILE HEADER + BOTTOM NAV ============ */
header.mob{
  background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;
  padding:calc(11px + env(safe-area-inset-top)) 15px 12px;
  display:flex;align-items:flex-start;gap:12px;
}
header.mob h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;line-height:1.05;
  letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;
}
header.mob h1 span{display:block;font-size:10px;font-weight:500;letter-spacing:.14em;color:#93A6C4;margin-top:3px}
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button{
  flex:1 1 0;min-width:0;background:none;border:0;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 1px 7px;
}
nav.bottom span{
  font-size:9px;letter-spacing:.01em;line-height:1;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
nav.bottom button[aria-selected="true"]{color:var(--ink)}
nav.bottom button[aria-selected="true"] svg{stroke:var(--signal)}
nav.bottom .ndot{
  position:absolute;transform:translate(11px,-4px);width:6px;height:6px;
  border-radius:50%;background:var(--st-block);
}

/* Desktop/tablet web layout — keep mobile navigation out of the web view. */
@media(min-width:860px){
  nav.bottom{display:none!important}
  .panel{margin-bottom:14px}
}

/* A full three-column dashboard needs enough usable width after the sidebar. */
@media(min-width:860px) and (max-width:1199px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .g3>div:nth-child(3){
    grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
  }
  .g3>div:nth-child(3)>.panel{margin-bottom:0}
  .g3>div:nth-child(3)>.panel:last-child{grid-column:1/-1}
}
@media(min-width:1200px){
  .g3{grid-template-columns:1.15fr 1fr 1fr;align-items:start}
}

/* ============ SYNC PILL ============ */
.sync{
  display:flex;align-items:center;gap:7px;font-size:11px;color:#93A6C4;
  background:none;border:0;cursor:pointer;padding:6px 2px;min-height:var(--tap);
}
aside .sync{color:#93A6C4;padding:2px}
.sync:disabled{opacity:.55}
.dot{width:7px;height:7px;border-radius:50%;background:var(--st-done);flex:none}
.dot.stale{background:var(--amber)} .dot.off{background:var(--st-block)}

/* ============ LAYOUT ============ */
main{padding:16px 14px calc(78px + env(safe-area-inset-bottom))}
@media(min-width:860px){ main{padding:26px 30px 40px} }
.wrap{max-width:1480px;margin:0 auto}
.view{display:none} .view.on{display:block}

.ph{margin:0 2px 14px}
.ph h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.01em;margin:0;text-transform:uppercase}
.ph p{margin:3px 0 0;font-size:13px;color:var(--ink-3)}
@media(min-width:860px){ .ph h2{font-size:30px} }

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.panel>h3{
  font-family:'Barlow Condensed',sans-serif;font-size:13.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  margin:0;padding:13px 16px;border-bottom:1px solid var(--rule-2);background:var(--panel-2);
}
.grid{display:grid;gap:14px}
@media(min-width:860px){
  .g2{grid-template-columns:1fr 1fr;align-items:start}
  .grid>div>.panel{margin-bottom:14px}
}

/* ============ HERO ============ */
.hero{
  background:var(--ink);color:#fff;border-radius:var(--r);padding:20px 20px 18px;
  margin-bottom:14px;box-shadow:var(--shadow);
}
.hero .row{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.hero .cd{display:flex;align-items:baseline;gap:11px}
.hero .cd b{font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:700;line-height:.82;color:var(--amber)}
.hero .cd i{font-style:normal;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#93A6C4;line-height:1.35}
.hero .meta{margin-left:auto;text-align:right;font-size:12.5px;color:#A9BAD4;line-height:1.7}
.hero .meta b{color:#fff;font-weight:600}
.ring{display:flex;gap:10px;align-items:center;margin-top:16px;padding-top:15px;border-top:1px solid #2C4A6C}
.ring .bar{flex:1;height:9px;border-radius:5px;background:#2C4A6C;overflow:hidden;display:flex}
.ring .bar i{display:block;height:100%}
.ring b{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#fff}
@media(max-width:520px){ .hero .meta{margin-left:0;text-align:left;width:100%} }

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule-2)}
@media(min-width:700px){ .stats{grid-template-columns:repeat(4,1fr)} }
.stat{background:var(--panel);padding:14px 16px}
.stat b{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;display:block}
.stat span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:5px}
.stat.bad b{color:var(--st-block)} .stat.warn b{color:var(--st-prog)} .stat.good b{color:var(--st-done)}

/* ============ ROWS ============ */
.bd{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:11px 16px;border-bottom:1px solid var(--rule-2);color:inherit}
.bd:last-child{border-bottom:0}
.bd:hover{background:var(--panel-2)}
.bd .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.bd .nm{font-weight:600;font-size:14px;flex:1;min-width:0}
.bd .pc{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink-2)}
.bar2{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--rule-2)}
.bar2 i{display:block;height:100%}
.bd .meta{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.warn-t{color:var(--st-block)}

.item{padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.item:last-child{border-bottom:0}
.l1{display:flex;gap:10px;align-items:flex-start}
.id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);padding-top:2px;flex:none}
.tx{flex:1;min-width:0;font-size:14.5px;line-height:1.42}
.l2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  font-size:10.5px;letter-spacing:.04em;padding:2.5px 7px;border-radius:5px;
  background:var(--panel-2);border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.tag.st{color:#fff;border-color:transparent;font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.st-none{background:var(--st-none)}.st-prog{background:var(--st-prog)}.st-done{background:var(--st-done)}
.st-block{background:var(--st-block)}.st-na{background:var(--st-na)}
.tag.due{background:#FFF7E8;border-color:#F0D08A;color:#7A4E00}
.tag.over,.tag.hi{background:#FDECEA;border-color:#F0B3AD;color:#93211A;font-weight:600}
.tag.tbc{background:#FDECEA;border-color:#F0B3AD;color:#93211A}
.tag.fly{background:#EAF3F8;border-color:#B8D6E6;color:#0B4D6B}
.grp{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);background:var(--panel-2);
  padding:8px 16px;border-bottom:1px solid var(--rule-2);border-top:1px solid var(--rule-2);
}
.grp:first-child{border-top:0}
.sub{font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.5}

/* priority chips */
.pri{flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:#fff}
.p1{background:#B3271E}.p2{background:#B26A00}.p3{background:#1F3864}.p4{background:#7B8AA1}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:12px 16px;border-bottom:1px solid var(--rule-2);font-size:11.5px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none;display:block}

/* rundown */
.rd{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.rd:last-child{border-bottom:0}
.rd .tm{flex:none;width:48px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;line-height:1.35}
.rd .tm small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.rd .kg{font-size:14.5px;line-height:1.42}
.rd.now{background:#FFF9EA;box-shadow:inset 3px 0 0 var(--amber)}
.rd.now .kg{font-weight:600}
.lane{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.rd-note{margin-top:8px;padding:7px 9px;border-left:3px solid var(--amber);background:#FFF9EA;border-radius:0 6px 6px 0;color:#6B4400;font-size:11.5px;line-height:1.45}
.tag.lane-tag{background:#EAF3F8;border-color:#B8D6E6;color:#0B4D6B;font-weight:600}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select,.filters input{
  font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--r-sm);padding:10px 11px;min-height:var(--tap);flex:1 1 140px;min-width:0;
}
.filters input{flex:1 1 100%}
@media(min-width:860px){ .filters input{flex:2 1 300px} }
.count{font-size:11.5px;color:var(--ink-3);margin:0 4px 9px}

.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:5px;font-weight:600}
.note{background:#FFF9EA;border:1px solid #F0D08A;border-radius:var(--r-sm);padding:11px 14px;
  font-size:12.5px;color:#6B4400;margin-bottom:14px;line-height:1.5}
.note b{display:block;margin-bottom:3px}
.kv{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-3);flex:none;width:118px;font-size:12px;padding-top:1px}
.kv b{font-weight:500;flex:1;min-width:0}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:22px 16px 6px;line-height:1.6}

/* ============ QUICK DASHBOARD ============ */
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
@media(min-width:700px){.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.metric-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#f7f9fc);border:1px solid var(--rule-2);border-radius:12px;padding:13px 14px;min-height:92px}
.metric-card:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--signal)}
.metric-card.warn:before{background:var(--amber)}.metric-card.bad:before{background:var(--st-block)}.metric-card.good:before{background:var(--st-done)}
.metric-card b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:32px;line-height:1;color:var(--ink)}
.metric-card span{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.metric-card small{display:block;margin-top:5px;color:var(--ink-2);font-size:11px;line-height:1.35}
.visual-bar{height:10px;background:var(--rule-2);border-radius:999px;overflow:hidden;display:flex;margin:12px 16px 8px}
.visual-bar i{display:block;height:100%}
.visual-legend{display:flex;flex-wrap:wrap;gap:8px 13px;padding:0 16px 13px;font-size:11px;color:var(--ink-2)}
.visual-legend span{display:flex;align-items:center;gap:5px}.visual-legend i{width:9px;height:9px;border-radius:3px;display:block}
.mini-bars{padding:11px 16px 14px}.mini-row{display:grid;grid-template-columns:minmax(88px,132px) 1fr auto;align-items:center;gap:9px;margin:8px 0;font-size:11.5px}
.mini-row span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini-track{height:8px;border-radius:999px;background:var(--rule-2);overflow:hidden}.mini-track i{display:block;height:100%;background:var(--signal);border-radius:999px}.mini-row b{font-family:'IBM Plex Mono',monospace;font-size:11px}
.vehicle-summary-grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 12px 12px}.vehicle-summary{border:1px solid var(--rule-2);border-radius:12px;background:var(--panel);overflow:hidden}.vehicle-summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule-2);background:var(--panel-2)}.vehicle-summary-head b{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}.vehicle-summary-head span{font-size:10.5px;color:var(--ink-3)}.vehicle-summary .mini-bars{padding:8px 12px 11px}.vehicle-summary.type .mini-row{grid-template-columns:minmax(120px,190px) 1fr auto}.vehicle-summary.company .mini-row{grid-template-columns:minmax(170px,270px) 1fr auto}@media(min-width:980px){.vehicle-summary-grid{grid-template-columns:.85fr 1.15fr}}@media(max-width:520px){.vehicle-summary.type .mini-row,.vehicle-summary.company .mini-row{grid-template-columns:minmax(110px,145px) 1fr auto}}
.consumption-overview{grid-template-columns:1fr}.consumption-overview .vehicle-summary .mini-row{grid-template-columns:minmax(110px,170px) 1fr auto}@media(min-width:700px){.consumption-overview{grid-template-columns:1fr 1fr}}
.consumption-days{padding:0 12px 12px}.cons-day{border:1px solid var(--rule-2);border-radius:12px;overflow:hidden;margin-top:12px;background:var(--panel)}.cons-day:first-child{margin-top:0}.cons-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--rule-2)}.cons-day-head b{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.cons-day-head span{font-size:10.5px;color:var(--ink-3);text-align:right}.cons-activity{display:grid;grid-template-columns:74px minmax(180px,1.5fr) minmax(90px,1fr) 60px;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule-2)}.cons-activity:last-child{border-bottom:0}.cons-clock b,.cons-qty b{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink)}.cons-clock span,.cons-qty span{display:block;font-size:9.5px;color:var(--ink-3);line-height:1.3}.cons-desc{min-width:0}.cons-desc b{display:block;font-size:12.5px;line-height:1.35}.cons-desc small{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cons-track{height:7px;border-radius:4px;background:var(--rule-2);overflow:hidden}.cons-track i{display:block;height:100%;border-radius:4px;background:var(--signal)}.cons-qty{text-align:right}.cons-qty b{font-size:13px}@media(max-width:620px){.cons-activity{grid-template-columns:58px minmax(0,1fr) 52px;gap:8px}.cons-track{grid-column:2/-1}.cons-desc small{white-space:normal}.cons-day-head{align-items:flex-start}}
.panel.fold>summary{list-style:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:13px 16px;border-bottom:1px solid var(--rule-2);background:var(--panel-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel.fold>summary::-webkit-details-marker{display:none}.panel.fold>summary:after{content:'−';font-family:'Inter',sans-serif;font-size:18px;line-height:1;color:var(--ink-3)}.panel.fold:not([open])>summary:after{content:'+'}.panel.fold:not([open])>summary{border-bottom:0}
.show-more{display:block;width:calc(100% - 32px);margin:10px 16px 14px;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink);border-radius:9px;min-height:40px;cursor:pointer;font-weight:600;font-size:12px}.show-more:hover{background:#eef3f8}
.deadline-extra[hidden]{display:none}
.timeline-wrap{overflow-x:auto;padding:12px 14px 16px}.timeline-chart{--tl-label:310px;min-width:1120px}
.tl-axis{display:grid;grid-template-columns:var(--tl-label) minmax(760px,1fr);gap:12px;align-items:end;margin-bottom:8px}.tl-hours{display:grid;grid-template-columns:repeat(7,1fr);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-3)}.tl-hours span{text-align:left}
.tl-legend{display:flex;flex-wrap:wrap;gap:7px 13px;padding:0 0 11px var(--tl-label);margin-left:12px;font-size:10.5px;color:var(--ink-2)}.tl-legend span{display:flex;align-items:center;gap:5px}.tl-legend i{display:block;width:10px;height:10px;border-radius:3px}.tl-legend .vip{background:#9A3B35}.tl-legend .undangan{background:#2F6D89}.tl-legend .gabungan{background:#0B6E99}.tl-legend .dirut{background:#284C78}.tl-legend .raker{background:#785A11}.tl-legend .konsultasi{background:#5C4A83}.tl-legend .olimpiade{background:#26735A}

<script>
/* ============================================================
   1. CONFIG — the only part you edit
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyv6LbN0vmO5C--NIqQfKEMGzmBMLj8Zfv89JNOQT_lU0YdqodVe7ODrWN4-YoT4F6JPQ/exec',                       // Apps Script /exec URL. Blank = demo data.
  EVENT_START: '2026-08-10',
  EVENT_END: '2026-08-12',
  CACHE_KEY: 'pim-event-cache-v8'
};

/* ============================================================
   2. Helpers
   ============================================================ */
let DATA=null, FETCHED=null, DEMO=false, PAGE='home';
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = v => v!==undefined && v!==null && String(v).trim()!=='';
function f(row,...names){
  for(const n of names){ if(has(row?.[n])) return String(row[n]).trim(); }
  const keys=Object.keys(row||{});
  for(const n of names){
    const k=keys.find(k=>k.toLowerCase().replace(/\s+/g,'').includes(n.toLowerCase().replace(/\s+/g,'')));
    if(k && has(row[k])) return String(row[k]).trim();
  }
  return '';
}
const rows = t => (DATA?.tabs?.[t]) || [];
const joinText = r => f(r,'Keikutsertaan').toUpperCase();
const isVIP = r => joinText(r).includes('VIP') || (!joinText(r) && f(r,'Rombongan').toUpperCase().includes('VIP'));
const isRaker = r => joinText(r).includes('RAKER');
const isVIPRaker = r => isVIP(r) && isRaker(r);
const CH = () => rows('CHECKLIST').filter(r=>has(f(r,'ID')));
const BD = () => rows('BIDANG').filter(r=>has(f(r,'Bidang')) && f(r,'Bidang').toUpperCase()!=='TOTAL');
const RD = () => rows('RUNDOWN').filter(r=>/^RD-\d+$/i.test(f(r,'ID')));

const ST={'not started':['st-none','Not Started'],'in progress':['st-prog','In Progress'],
  'done':['st-done','Done'],'blocked':['st-block','Blocked'],'n/a':['st-na','N/A']};
const stTag = v => { const m=ST[String(v||'').trim().toLowerCase()]||['st-none',v||'Not Started'];
  return `<i class="tag st ${m[0]}">${esc(m[1])}</i>`; };
function eventClock(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const p=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,hm:`${p.hour}:${p.minute}`};
}
const today=()=>parseD(eventClock().date);
function parseD(s){ if(!has(s)) return null;
  const m=String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s); return isNaN(d)?null:d; }
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD=s=>{const d=parseD(s);return d?`${d.getDate()} ${MON[d.getMonth()]}`:esc(s);};
const isOver=(dl,st)=>{const d=parseD(dl); if(!d) return false;
  const s=String(st||'').toLowerCase(); return d<today() && s!=='done' && s!=='n/a';};
const daysTo=()=>Math.round((parseD(CONFIG.EVENT_START)-today())/86400000);

const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0;};
const isMess=r=>{const t=f(r,'Tipe').toLowerCase(),l=f(r,'Lokasi').toLowerCase();return !t.includes('hotel')&&!l.includes('hotel');};
const accommodationKind=r=>/^rumah\b/i.test(f(r,'Lokasi').trim())?'Rumah Kompleks':'Mess';
const roomFilled=r=>has(f(r,'Tamu'))&&!/^(free|kosong|na|n\/a|-)$/i.test(f(r,'Tamu'));
const roomReady=r=>/^(ready|siap|baik)$/i.test(f(r,'Kesiapan'))||(!/pengisian|belum|proses/i.test(f(r,'Kesiapan'))&&has(f(r,'Kesiapan')));
function pctWidth(v,total){return Math.max(0,Math.min(100,total?Math.round(v/total*100):0));}
function miniRows(data,total){return data.map(([label,val])=>`<div class="mini-row"><span title="${esc(label)}">${esc(label)}</span><div class="mini-track"><i style="width:${pctWidth(val,total)}%"></i></div><b>${esc(val)}</b></div>`).join('');}
function timelineClass(lane){const v=String(lane||'').toLowerCase();if(v.includes('vip')&&v.includes('undangan'))return'gabungan';if(v.includes('vip'))return'vip';if(v.includes('undangan'))return'undangan';if(v.includes('raker'))return'raker';if(v.includes('konsultasi'))return'konsultasi';if(v.includes('olimpiade'))return'olimpiade';if(v.includes('dirut'))return'dirut';return'';}
function hmMinutes(v){const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?(+m[1]*60 + +m[2]):null;}
function fmtClock(v){const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?`${String(+m[1]).padStart(2,'0')}:${m[2]}`:'';}
function fmtDayDate(s){const d=parseD(s);if(!d)return esc(s);const dn=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];return `${dn[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;}
function placeTag(venue,activity=''){
  const v=`${venue} ${activity}`.toLowerCase();
  const kno=v.indexOf('kno'),lsw=v.indexOf('lsw');
  if((v.includes('cgk')||v.includes('soekarno'))&&(v.includes('kno')||v.includes('kualanamu')))return'Jakarta → Medan';
  if(kno>=0&&lsw>=0)return kno<lsw?'Medan → Lhokseumawe':'Lhokseumawe → Medan';
  if(v.includes('medan')||v.includes('kualanamu')||v.includes('palm beach'))return'Medan';
  if(v.includes('welcoming dinner'))return'Lhokseumawe / PIM';
  if(v.includes('malikussaleh')||v.includes('lhokseumawe')||v.includes('pupuk iskandar muda')||v.includes('gedung pertemuan')||v.includes('wisma raja lanang')||v.includes('ruang keupula')||v.includes('ruang teuku umar')||v.includes('tenda'))return'Lhokseumawe / PIM';
  return venue||'Lokasi belum diisi';
}
function timelineBlock(row,label=null,lane=null,venue=null){return{label:label||f(row,'Kegiatan'),lane:lane||f(row,'Jalur'),venue:venue||f(row,'Venue'),start:f(row,'Mulai'),end:f(row,'Selesai')};}
function aggregateBlock(list,label,lane,venue=null){
  if(!list.length)return null;
  const starts=list.map(r=>hmMinutes(f(r,'Mulai'))).filter(v=>v!==null),ends=list.map(r=>hmMinutes(f(r,'Selesai'))).filter(v=>v!==null);
  if(!starts.length)return null;
  const sm=Math.min(...starts),em=Math.max(...ends);
  const hm=v=>`${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;
  return{label,lane,venue:venue||f(list[0],'Venue'),start:hm(sm),end:hm(em)};
}
function summaryTimelineItems(dayRows){
  const items=[],add=x=>{if(x&&hmMinutes(x.start)!==null)items.push(x);};
  const find=re=>dayRows.find(r=>re.test(f(r,'Kegiatan')));
  const findAll=re=>dayRows.filter(r=>re.test(f(r,'Kegiatan')));

  dayRows.filter(r=>/\bflight\b/i.test(f(r,'Kegiatan'))).forEach(r=>add(timelineBlock(r)));
  dayRows.filter(r=>/^(VIP Dinner|Welcoming Dinner)$/i.test(f(r,'Kegiatan'))).forEach(r=>add(timelineBlock(r)));
  const rakor=find(/Rakor Direktur Utama/i);if(rakor)add(timelineBlock(rakor));
  dayRows.filter(r=>/^Sarapan/i.test(f(r,'Kegiatan'))).forEach(r=>add(timelineBlock(r)));

  const plenaryStart=find(/Kedatangan Tamu VIP di Plenary Session/i)||find(/^Plenary Session$/i);
  const plenaryEnd=find(/Plenary Session selesai/i)||find(/^Plenary Session$/i);
  if(plenaryStart&&plenaryEnd)add({label:'Kedatangan VIP & Plenary Session',lane:'TAMU VIP + TAMU UNDANGAN',venue:'Gedung Pertemuan',start:f(plenaryStart,'Mulai'),end:f(plenaryEnd,'Selesai')});

  const plant=find(/^Plant Tour/i);if(plant)add(timelineBlock(plant));
  dayRows.filter(r=>/^Ishoma$/i.test(f(r,'Kegiatan'))).forEach(r=>add(timelineBlock(r)));

  const rakerRows=dayRows.filter(r=>f(r,'Jalur').toUpperCase()==='TAMU UNDANGAN'&&/tenda di sebelah gedung pertemuan/i.test(f(r,'Venue')));
  add(aggregateBlock(rakerRows,'Raker RKAP 2027 PI Group','RAKER RKAP','Tenda di sebelah Gedung Pertemuan'));

  const consultation=dayRows.filter(r=>/KONSULTASI/i.test(f(r,'Jalur')));
  add(aggregateBlock(consultation,'Rapat Konsultasi & Pengawasan','RAPAT KONSULTASI','Ruang Teuku Umar'));

  const olympicPrep=find(/Persiapan Final Bulutangkis & makan malam peserta/i);if(olympicPrep)add(timelineBlock(olympicPrep,'Makan Malam & Persiapan Final Olimpiade'));
  const olympicFinal=dayRows.filter(r=>/OLIMPIADE/i.test(f(r,'Jalur'))&&!/Persiapan Final/i.test(f(r,'Kegiatan')));
  add(aggregateBlock(olympicFinal,'Final Olimpiade PI Group & Awarding','OLIMPIADE PI GROUP','Gedung Pertemuan'));

  dayRows.filter(r=>/persiapan kepulangan/i.test(f(r,'Kegiatan'))).forEach(r=>add(timelineBlock(r)));

  const dedup=new Map();
  items.forEach(x=>{const k=[x.label,x.start,x.end,x.lane].join('|');if(!dedup.has(k))dedup.set(k,x);});
  return [...dedup.values()].sort((a,b)=>(hmMinutes(a.start)||0)-(hmMinutes(b.start)||0)||String(a.lane).localeCompare(String(b.lane)));
}
function rundownChart(){
  const all=RD();
  const days=[...new Set(all.map(r=>f(r,'Tanggal')).filter(has))].sort();
  if(!days.length)return'<div class="empty">Rundown belum tersedia.</div>';
  const axis='<div class="tl-axis"><span></span><div class="tl-hours"><span>06:00</span><span>09:00</span><span>12:00</span><span>15:00</span><span>18:00</span><span>21:00</span><span>24:00</span></div></div>';
  const legend='<div class="tl-legend"><span><i class="vip"></i>VIP</span><span><i class="undangan"></i>Tamu Undangan</span><span><i class="gabungan"></i>Gabungan</span><span><i class="dirut"></i>Rakor Dirut</span><span><i class="raker"></i>Raker RKAP</span><span><i class="konsultasi"></i>Rapat Konsultasi</span><span><i class="olimpiade"></i>Olimpiade</span></div>';
  const body=days.map(day=>{
    const dayRows=all.filter(r=>f(r,'Tanggal')===day);
    const list=summaryTimelineItems(dayRows);
    const rowsHtml=list.map(r=>{
      const sm=hmMinutes(r.start),em=hmMinutes(r.end);
      if(sm===null)return'';
      const start=Math.max(360,Math.min(1440,sm));
      let end=em===null?start+15:em;if(end<sm)end+=1440;end=Math.max(start+12,Math.min(1440,end));
      const left=(start-360)/1080*100,width=Math.max(1.5,(end-start)/1080*100);
      const loc=placeTag(r.venue,r.label),barText=`${r.lane} · ${loc}`;
      return `<div class="tl-row"><div class="tl-label" title="${esc(r.label)} · ${esc(r.venue)}"><span class="tl-activity"><span class="tl-time">${esc(String(r.start).slice(0,5))}</span> ${esc(r.label)}</span><span class="tl-location"><i class="tl-place">${esc(loc)}</i><span class="tl-venue">${esc(r.venue)}</span></span></div><div class="tl-track"><div class="tl-bar ${timelineClass(r.lane)}" style="left:${left}%;width:${width}%" title="${esc(r.label)} · ${esc(r.lane)} · ${esc(r.venue)}">${esc(barText)}</div></div></div>`;
    }).join('');
    return `<div class="tl-day"><div class="tl-day-title"><b>${fmtDayDate(day)}</b><span>${list.length} blok kegiatan</span></div>${rowsHtml||'<div class="empty">Tidak ada kegiatan utama pada hari ini.</div>'}</div>`;
  }).join('');
  return `<div class="timeline-wrap"><div class="timeline-chart">${axis}${legend}${body}</div></div>`;
}

const IC={

  run:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',

  lo:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="10" r="2.4"/><path d="M8 17c.6-1.9 2.1-3 4-3s3.4 1.1 4 3"/>',
  isu:'<path d="M12 3.8 21 19.5H3z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>'
};
const PAGES=[
  ['home','Beranda','Beranda'],['chk','Checklist','Checklist'],['run','Rundown','Rundown'],
  ['tamu','Tamu','Tamu'],['akm','Kamar','Akomodasi'],['lo','LO','Liaison Officer'],['isu','Issues','Issues']
];
function svg(k){ return `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`; }
function buildNav(){
  $('#bnav').innerHTML = PAGES.map(([k,short])=>
    `<button role="tab" data-v="${k}" aria-selected="${k===PAGE}">${svg(k)}<span>${short}</span></button>`).join('');
  $('#snav').innerHTML = PAGES.map(([k,,long])=>
    `<button role="tab" data-v="${k}" aria-selected="${k===PAGE}">${svg(k)}<span>${long}</span><i class="badge" data-b="${k}" hidden></i></button>`).join('');
  $$('#bnav button, #snav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
}

/* ============================================================
   4. Load
   ============================================================ */
const readCache=()=>{try{return JSON.parse(localStorage.getItem(CONFIG.CACHE_KEY))}catch(e){return null}};
const writeCache=(p,w)=>{try{localStorage.setItem(CONFIG.CACHE_KEY,JSON.stringify({payload:p,when:w}))}catch(e){}};
function setSync(state,text){
  [['#dot','#syncTx'],['#dot2','#syncTx2']].forEach(([d,t])=>{
    const de=$(d), te=$(t); if(!de) return;
    de.className='dot'+(state==='stale'?' stale':state==='off'?' off':'');
    te.textContent=text;
  });
}
function relTime(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return 'baru saja'; if(m<60) return m+' menit lalu';
  const h=Math.round(m/60); return h<24 ? h+' jam lalu' : Math.round(h/24)+' hari lalu';
}
async function load(){
  const c=readCache();
  if(c && !DATA){ DATA=c.payload; FETCHED=c.when; render(); setSync('stale','Cached · '+relTime(c.when)); }
  if(!CONFIG.API_URL){ DEMO=true; DATA=DEMO_DATA; FETCHED=new Date().toISOString(); render(); setSync('stale','Demo data'); return; }
  setSync('','Loading…'); $$('.sync').forEach(b=>b.disabled=true);
  try{
    const res=await fetch(CONFIG.API_URL+(CONFIG.API_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(j.ok===false) throw new Error(j.error||'Sheet menolak permintaan');
    DATA=j; FETCHED=new Date().toISOString(); DEMO=false;
    writeCache(j,FETCHED); render(); setSync('','Updated '+relTime(FETCHED));
  }catch(err){
    if(DATA) setSync('off','Offline · '+relTime(FETCHED));
    else { setSync('off','Gagal memuat');
      $('#v-home').innerHTML=`<div class="panel"><div class="empty"><b>Data belum bisa dimuat</b>
        Periksa sambungan, lalu ketuk status di kanan atas untuk mencoba lagi.
        <div style="margin-top:10px;font-size:11px;font-family:'IBM Plex Mono',monospace">${esc(err.message||err)}</div>
      </div></div>`; }
  }finally{ $$('.sync').forEach(b=>b.disabled=false); }
}

function drawChk(){
  const q=($('#fCari')?.value||'').toLowerCase().trim();
  const fb=$('#fBidang')?.value||'',fs=$('#fStatus')?.value||'';
  const fa=$('#fAcara')?.value||'',fo=$('#fOwner')?.value||'';
  let list=CH().filter(r=>{
    if(fb&&f(r,'Bidang')!==fb) return false;
    if(fs&&f(r,'Status')!==fs) return false;
    if(fa&&f(r,'Acara')!==fa) return false;
    if(fo&&f(r,'Owner')!==fo) return false;
    if(q){ const h=[f(r,'Item'),f(r,'PIC'),f(r,'Venue'),f(r,'Bidang'),f(r,'ID'),f(r,'Catatan')].join(' ').toLowerCase();
      if(!h.includes(q)) return false; }
    return true;
  });
  const rank=r=>isOver(f(r,'Deadline'),f(r,'Status'))?0:(f(r,'Status').toLowerCase()==='blocked'?1:2);

  $('#cChk').textContent=list.length+' dari '+CH().length+' item';
  if(!list.length){ $('#listChk').innerHTML='<div class="empty"><b>Tidak ada item yang cocok</b>Ubah kata kunci atau kosongkan filter.</div>'; return; }
  let h='',g='';
  for(const r of list){
    const b=f(r,'Bidang'); if(b!==g){g=b;h+=`<div class="grp">${esc(b)}</div>`;}
    const dl=f(r,'Deadline'),st=f(r,'Status'),ov=isOver(dl,st),own=f(r,'Owner'),pic=f(r,'PIC'),cat=f(r,'Catatan');
    h+=`<div class="item">
